<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 — 주문 관리 | SOEZ</title>
  <style>
:root {
  --navy: #0F1B3A; --navy2: #1B2B4B; --blue: #3B6FD4; --blue2: #2C5BB8;
  --text: #0F172A; --text2: #64748B; --border: #E2E8F0; --bg: #F8FAFC;
  --green: #16A34A; --green-bg: #DCFCE7; --red: #DC2626; --red-bg: #FEE2E2;
  --yellow-bg: #FEF9C3; --yellow: #D97706; --kakao: #FEE500;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
       background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── 로그인 ── */
.login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--navy); }
.login-card { background:#fff; border-radius:16px; padding:40px 44px; width:100%; max-width:380px;
               box-shadow:0 8px 32px rgba(0,0,0,.25); text-align:center; }
.login-logo { font-size:2rem; font-weight:900; color:var(--navy2); letter-spacing:4px; margin-bottom:4px; }
.login-sub  { font-size:.8rem; color:var(--text2); margin-bottom:28px; }
.login-card input { width:100%; padding:13px 16px; border:1.5px solid var(--border);
  border-radius:8px; font-size:.95rem; outline:none; margin-bottom:12px; transition:border-color .2s; }
.login-card input:focus { border-color:var(--blue); }
.login-btn { width:100%; padding:13px; background:var(--blue); color:#fff; border:none;
             border-radius:8px; font-size:1rem; font-weight:800; cursor:pointer; transition:background .2s; }
.login-btn:hover { background:var(--blue2); }
.login-err { font-size:.83rem; color:var(--red); margin-top:8px; display:none; }

/* ── 패널 ── */
.panel { display:none; }
.topbar { background:var(--navy2); color:#fff; padding:0 24px;
          display:flex; align-items:center; justify-content:space-between; height:60px; }
.topbar h1 { font-size:.95rem; font-weight:800; }
.topbar-right { display:flex; align-items:center; gap:12px; font-size:.82rem; color:#A8BFDB; }
.logout-btn { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2);
              color:#fff; padding:6px 14px; border-radius:6px; cursor:pointer; font-size:.8rem; }
.logout-btn:hover { background:rgba(255,255,255,.2); }
.refresh-indicator { font-size:.78rem; color:#7094C4; }

.main { max-width:1280px; margin:0 auto; padding:28px 20px; }

/* ── 새 주문 알림 배너 ── */
.new-order-banner {
  display:none; background:#FFF7ED; border:2px solid #F59E0B; border-radius:10px;
  padding:14px 20px; margin-bottom:20px; font-weight:700; color:#92400E;
  display:flex; align-items:center; gap:10px; animation:pulse 1s infinite;
}
.new-order-banner.hidden { display:none !important; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.7} }

/* ── 검색/탭 바 ── */
.toolbar { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
.tab-btn { padding:8px 16px; border-radius:8px; border:1.5px solid var(--border);
           background:#fff; font-size:.85rem; font-weight:700; cursor:pointer;
           transition:all .15s; color:var(--text2); white-space:nowrap; }
.tab-btn.active { background:var(--blue); color:#fff; border-color:var(--blue); }
.tab-btn .cnt { display:inline-block; background:rgba(0,0,0,.1); border-radius:99px;
                font-size:.72rem; padding:1px 6px; margin-left:3px; }
.tab-btn.active .cnt { background:rgba(255,255,255,.25); }
.search-input { flex:1; min-width:180px; padding:9px 14px; border:1.5px solid var(--border);
                border-radius:8px; font-size:.88rem; outline:none; transition:border-color .2s; }
.search-input:focus { border-color:var(--blue); }
.refresh-btn { padding:8px 14px; background:#fff; border:1.5px solid var(--border);
               border-radius:8px; font-size:.85rem; font-weight:600; cursor:pointer;
               color:var(--text2); transition:all .15s; white-space:nowrap; }
.refresh-btn:hover { border-color:var(--blue); color:var(--blue); }

/* ── 주문 카드 ── */
.orders-grid { display:grid; gap:14px; }
.order-card { background:#fff; border-radius:12px; border:1.5px solid var(--border);
              padding:20px 22px; box-shadow:0 1px 4px rgba(0,0,0,.04); transition:box-shadow .15s; }
.order-card:hover { box-shadow:0 3px 14px rgba(0,0,0,.08); }
.order-card.is-new { border-color:#F59E0B; background:#FFFDF5; }

.order-card-head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:12px; }
.order-id { font-size:.75rem; color:var(--text2); font-weight:600; }
.order-company { font-size:1.05rem; font-weight:800; color:var(--navy2); margin-top:2px; }
.order-product { font-size:.78rem; color:var(--blue); font-weight:600; margin-top:2px; }
.status-badge { display:inline-block; padding:4px 12px; border-radius:99px; font-size:.76rem; font-weight:700; white-space:nowrap; }
.status-pending  { background:var(--yellow-bg); color:var(--yellow); }
.status-approved { background:var(--green-bg);  color:var(--green); }
.status-rejected { background:var(--red-bg);    color:var(--red); }

.order-info { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px,1fr));
              gap:8px 20px; font-size:.84rem; margin-bottom:14px; }
.info-item .label { color:var(--text2); font-size:.75rem; margin-bottom:2px; }
.info-item .val { font-weight:600; color:var(--text); word-break:break-all; }

.order-card-foot { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.btn-approve { padding:9px 18px; background:var(--green); color:#fff;
               border:none; border-radius:8px; font-size:.85rem; font-weight:700; cursor:pointer; }
.btn-approve:hover { background:#15803D; }
.btn-reject  { padding:9px 18px; background:#fff; color:var(--red);
               border:1.5px solid var(--red); border-radius:8px; font-size:.85rem; font-weight:700; cursor:pointer; }
.btn-reject:hover { background:var(--red); color:#fff; }
.biz-link { font-size:.8rem; color:var(--blue); cursor:pointer; text-decoration:underline; margin-left:auto; }
.voucher-inline { font-family:monospace; font-size:.9rem; font-weight:700;
                  color:var(--blue); background:#EBF0FB; padding:3px 9px; border-radius:5px; }

/* ── 빈 상태 / 로딩 ── */
.empty-state { text-align:center; padding:60px 24px; color:var(--text2); }
.empty-state .icon { font-size:2.5rem; margin-bottom:10px; }
.loading { text-align:center; padding:48px; color:var(--text2); font-size:.93rem; }

/* ── 승인 완료 모달 ── */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.55);
                 display:none; align-items:center; justify-content:center; z-index:999; padding:16px; }
.modal-overlay.open { display:flex; }
.modal { background:#fff; border-radius:16px; padding:32px; width:100%; max-width:560px;
         box-shadow:0 8px 32px rgba(0,0,0,.2); max-height:90vh; overflow-y:auto; }
.modal-title { font-size:1.1rem; font-weight:800; color:var(--navy2); margin-bottom:20px; }

/* 바우처 코드 박스 */
.voucher-box { background:#EBF5FF; border:2px dashed var(--blue); border-radius:12px;
               padding:22px; text-align:center; margin-bottom:20px; }
.voucher-label { font-size:.78rem; color:var(--text2); margin-bottom:6px; }
.voucher-big { font-family:monospace; font-size:2rem; font-weight:900; color:var(--navy2);
               letter-spacing:4px; margin-bottom:12px; }
.copy-btn { display:inline-flex; align-items:center; gap:6px; padding:8px 18px;
            background:var(--blue); color:#fff; border:none; border-radius:8px;
            font-size:.85rem; font-weight:700; cursor:pointer; transition:background .15s; }
.copy-btn:hover { background:var(--blue2); }
.copy-btn.green { background:var(--green); }
.copy-btn.green:hover { background:#15803D; }
.copy-btn.kakao { background:var(--kakao); color:#000; }
.copy-btn.kakao:hover { background:#E6CF00; }

/* 메시지 템플릿 박스 */
.tmpl-section { margin-bottom:18px; }
.tmpl-section h4 { font-size:.85rem; font-weight:700; color:var(--navy2); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
.tmpl-box { background:#F8FAFC; border:1.5px solid var(--border); border-radius:8px;
            padding:14px; font-size:.82rem; line-height:1.75; white-space:pre-wrap;
            color:var(--text); font-family:inherit; max-height:200px; overflow-y:auto; }

/* 고객 정보 */
.customer-info-box { background:#F0FDF4; border:1px solid #BBF7D0; border-radius:8px;
                     padding:14px 16px; margin-bottom:18px; font-size:.83rem; }
.customer-info-box .ci-row { display:flex; justify-content:space-between; padding:4px 0;
                              border-bottom:1px solid #D1FAE5; }
.customer-info-box .ci-row:last-child { border-bottom:none; }
.customer-info-box .ci-label { color:#15803D; font-weight:600; }
.customer-info-box .ci-val   { color:var(--text); font-weight:700; }

/* 반려 모달 */
.reject-modal { max-width:420px; }
.reject-modal textarea { width:100%; padding:10px 12px; border:1.5px solid var(--border);
  border-radius:8px; font-size:.88rem; height:80px; resize:none; outline:none;
  font-family:inherit; transition:border-color .2s; margin-top:8px; }
.reject-modal textarea:focus { border-color:var(--red); }
.modal-btns { display:flex; gap:10px; margin-top:16px; }
.modal-btns button { flex:1; padding:11px; border-radius:8px; font-size:.9rem; font-weight:700; cursor:pointer; border:none; }
.modal-confirm-red { background:var(--red); color:#fff; }
.modal-confirm-red:hover { background:#B91C1C; }
.modal-close { background:var(--bg); color:var(--text2); }
.modal-close:hover { background:var(--border); }

/* ── 스낵바 ── */
.snackbar { position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
            background:#1E293B; color:#fff; padding:12px 24px; border-radius:10px;
            font-size:.88rem; font-weight:600; box-shadow:0 4px 20px rgba(0,0,0,.25);
            z-index:9999; opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap; }
.snackbar.show { opacity:1; }

@media (max-width:768px) {
  .topbar h1 { font-size:.85rem; }
  .voucher-big { font-size:1.5rem; }
  .modal { padding:22px 18px; }
  /* 모바일에서 정보 행을 2열로 */
  .order-info-grid { grid-template-columns:1fr 1fr !important; }
}
  </style>
</head>
<body>

<!-- ── 로그인 ── -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="login-logo">SOEZ</div>
    <div class="login-sub">관리자 주문 관리 페이지</div>
    <input type="password" id="adminKeyInput" placeholder="관리자 키를 입력하세요"
           onkeydown="if(event.key==='Enter') doLogin()">
    <button class="login-btn" onclick="doLogin()">로그인</button>
    <div class="login-err" id="loginErr">관리자 키가 올바르지 않습니다.</div>
  </div>
</div>

<!-- ── 관리자 패널 ── -->
<div class="panel" id="adminPanel">

  <div class="topbar">
    <h1>📋 SOEZ 주문 관리</h1>
    <div class="topbar-right">
      <span class="refresh-indicator" id="refreshCountdown"></span>
      <span id="adminKeyDisplay"></span>
      <button class="logout-btn" onclick="doLogout()">로그아웃</button>
    </div>
  </div>

  <div class="main">

    <!-- 새 주문 알림 배너 -->
    <div class="new-order-banner hidden" id="newOrderBanner">
      🔔 새로운 주문이 <span id="newOrderCount"></span>건 접수되었습니다!
      <button onclick="dismissBanner()" style="margin-left:auto;background:none;border:none;cursor:pointer;font-size:1.1rem;">✕</button>
    </div>

    <!-- 툴바 -->
    <div class="toolbar">
      <button class="tab-btn active" data-status="" onclick="switchTab(this,'')">
        전체 <span class="cnt" id="cnt-all">—</span>
      </button>
      <button class="tab-btn" data-status="pending" onclick="switchTab(this,'pending')">
        입금 대기 <span class="cnt" id="cnt-pending">—</span>
      </button>
      <button class="tab-btn" data-status="approved" onclick="switchTab(this,'approved')">
        승인 완료 <span class="cnt" id="cnt-approved">—</span>
      </button>
      <button class="tab-btn" data-status="rejected" onclick="switchTab(this,'rejected')">
        반려 <span class="cnt" id="cnt-rejected">—</span>
      </button>
      <input type="search" class="search-input" id="searchInput"
             placeholder="🔍 업체명·이름·이메일 검색" oninput="renderOrders()">
      <button class="refresh-btn" onclick="loadOrders()">🔄 새로고침</button>
    </div>

    <div id="ordersList">
      <div class="loading">주문을 불러오는 중...</div>
    </div>
  </div>
</div>

<!-- ── 승인 완료 모달 ── -->
<div class="modal-overlay" id="approveModal">
  <div class="modal">
    <div class="modal-title">✅ 승인 완료 — 고객에게 전달하세요</div>

    <!-- 고객 정보 -->
    <div class="customer-info-box" id="approveCustomerInfo"></div>

    <!-- 바우처 코드 -->
    <div class="voucher-box">
      <div class="voucher-label">🔑 라이선스 바우처 코드</div>
      <div class="voucher-big" id="approveVoucherCode">—</div>
      <button class="copy-btn" onclick="copyText('voucherOnly')">📋 코드만 복사</button>
    </div>

    <!-- 카카오톡 메시지 -->
    <div class="tmpl-section">
      <h4>💛 카카오톡으로 전송할 메시지</h4>
      <div class="tmpl-box" id="kakaoMsgBox"></div>
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="copy-btn kakao" onclick="copyText('kakao')">💛 카카오톡 메시지 복사</button>
      </div>
    </div>

    <!-- 이메일 내용 -->
    <div class="tmpl-section">
      <h4>📧 이메일로 전송할 내용</h4>
      <div class="tmpl-box" id="emailMsgBox"></div>
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="copy-btn green" onclick="copyText('email')">📧 이메일 내용 복사</button>
      </div>
    </div>

    <div style="margin-top:4px;text-align:right;">
      <button class="copy-btn" style="background:var(--text2);" onclick="closeApproveModal()">닫기</button>
    </div>
  </div>
</div>

<!-- ── 반려 모달 ── -->
<div class="modal-overlay" id="rejectModal">
  <div class="modal reject-modal">
    <div class="modal-title">⚠️ 주문 반려</div>
    <p style="font-size:.88rem;color:var(--text2);">주문 <strong id="rejectOrderId"></strong>을 반려하시겠습니까?</p>
    <textarea id="rejectMemo" placeholder="반려 사유 (선택 — 고객에게 안내할 내용)"></textarea>
    <div class="modal-btns">
      <button class="modal-close" onclick="closeRejectModal()">취소</button>
      <button class="modal-confirm-red" onclick="confirmReject()">반려 확인</button>
    </div>
  </div>
</div>

<!-- 알림음 -->
<audio id="notifySound" preload="auto">
  <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAA..." type="audio/wav">
</audio>

<div class="snackbar" id="snackbar"></div>

<script>
const API_URL = "https://web-production-7913d.up.railway.app";
const DOWNLOAD_URL = "https://github.com/dreamsysmj-cloud/soez-site/releases/download/v1.2.9/B2B%ED%83%9D%EB%B0%B0%EC%86%A1%EC%9E%A5%EB%A7%8C%EB%93%A4%EA%B8%B0_%EC%84%A4%EC%B9%98%ED%94%84%EB%A1%9C%EA%B7%B8%EB%9E%A8_v1.2.9.exe";
const PRODUCT_NAME = "SOEZ B2B 택배 송장 만들기 v1.2.9";
const KAKAO_CH    = "http://pf.kakao.com/_ACvjX/chat";

let adminKey = "";
let currentStatus = "";
let allOrders = [];
let prevPendingCount = -1;
let refreshTimer = null;
let countdownTimer = null;
let pendingRejectId = null;
let approveData = {};

// ────────────────────────────────────────────────────
// 로그인 / 로그아웃
// ────────────────────────────────────────────────────
function doLogin() {
  const key = document.getElementById("adminKeyInput").value.trim();
  if (!key) return;
  adminKey = key;
  document.getElementById("adminKeyDisplay").textContent = "키: " + key.slice(0,3) + "***";
  document.getElementById("loginWrap").style.display  = "none";
  document.getElementById("adminPanel").style.display = "block";
  loadOrders();
  startAutoRefresh();
}
function doLogout() {
  adminKey = ""; allOrders = [];
  clearInterval(refreshTimer); clearInterval(countdownTimer);
  document.getElementById("loginWrap").style.display  = "flex";
  document.getElementById("adminPanel").style.display = "none";
  document.getElementById("adminKeyInput").value = "";
  document.getElementById("loginErr").style.display   = "none";
}

// ────────────────────────────────────────────────────
// 자동 새로고침 (30초)
// ────────────────────────────────────────────────────
function startAutoRefresh() {
  let secs = 600;
  clearInterval(refreshTimer); clearInterval(countdownTimer);
  const cdEl = document.getElementById("refreshCountdown");
  countdownTimer = setInterval(() => {
    secs--;
    const m = Math.floor(secs / 60), s = secs % 60;
    cdEl.textContent = `🔄 ${m}분 ${String(s).padStart(2,'0')}초 후 자동 갱신`;
    if (secs <= 0) {
      secs = 600;
      loadOrders();
    }
  }, 1000);
}

// ────────────────────────────────────────────────────
// 탭 전환
// ────────────────────────────────────────────────────
function switchTab(el, status) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  el.classList.add("active");
  currentStatus = status;
  renderOrders();
}

// ────────────────────────────────────────────────────
// 주문 로드
// ────────────────────────────────────────────────────
async function loadOrders() {
  try {
    const res = await fetch(`${API_URL}/admin/orders`, {
      headers: { "X-Admin-Key": adminKey }
    });
    if (res.status === 403) {
      document.getElementById("loginErr").style.display = "block";
      doLogout(); return;
    }
    const data = await res.json();
    const orders = data.data || [];

    // 새 주문 감지
    const newPending = orders.filter(o => o.status === "pending").length;
    if (prevPendingCount >= 0 && newPending > prevPendingCount) {
      showNewOrderAlert(newPending - prevPendingCount);
      playBeep();
    }
    prevPendingCount = newPending;

    allOrders = orders;
    updateCounts();
    renderOrders();
  } catch (e) {
    document.getElementById("ordersList").innerHTML =
      `<div class="empty-state"><div class="icon">⚠️</div><p>서버 연결 오류: ${e.message}</p></div>`;
  }
}

function updateCounts() {
  const cnt = s => s ? allOrders.filter(o => o.status === s).length : allOrders.length;
  ["","pending","approved","rejected"].forEach(s =>
    document.getElementById("cnt-" + (s||"all")).textContent = cnt(s)
  );
}

// ────────────────────────────────────────────────────
// 주문 렌더
// ────────────────────────────────────────────────────
function renderOrders() {
  const q = (document.getElementById("searchInput").value || "").toLowerCase();
  let list = currentStatus ? allOrders.filter(o => o.status === currentStatus) : allOrders;
  if (q) list = list.filter(o =>
    [o.company_name, o.buyer_name, o.email, o.phone].some(v => (v||"").toLowerCase().includes(q))
  );

  const el = document.getElementById("ordersList");
  if (!list.length) {
    el.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>주문이 없습니다.</p></div>';
    return;
  }
  el.innerHTML = '<div class="orders-grid">' + list.map(orderCard).join("") + '</div>';
}

function orderCard(o) {
  const statusLabel = {pending:"입금 대기", approved:"승인 완료", rejected:"반려"}[o.status] || o.status;
  const dt = (o.created_at||"").replace("T"," ").substring(0,16);
  const approvedDt = (o.approved_at||"").replace("T"," ").substring(0,16);
  const isPending  = o.status === "pending";
  const isApproved = o.status === "approved";
  const amtFmt = o.amount ? "₩" + Number(o.amount).toLocaleString("ko-KR") + "원" : "₩495,000원";

  // 첨부파일 셀
  const bizCell = o.biz_reg_name
    ? `<button onclick="viewBizReg(${o.id})" style="background:#15803D;color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:.75rem;font-weight:700;cursor:pointer;white-space:nowrap;">⬇️ ${esc(o.biz_reg_name)}</button>`
    : `<span style="color:var(--text2);font-size:.8rem;">없음</span>`;

  // 전달메시지 버튼 (승인일시 옆)
  const msgBtn = isApproved
    ? `<button onclick="showResendModal(${JSON.stringify(o)})" style="background:var(--blue);color:#fff;border:none;border-radius:6px;padding:4px 12px;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;">📤 전달 메시지</button>`
    : "";

  // 바우처 코드 박스 (승인 완료 시 카드 하단에 크게)
  const voucherBlock = isApproved && o.voucher_code ? `
    <div style="background:#EBF5FF;border:2px solid var(--blue);border-radius:10px;padding:14px 20px;margin-top:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
      <div>
        <div style="font-size:.72rem;color:var(--text2);margin-bottom:4px;">🔑 라이선스 바우처 코드</div>
        <div style="font-family:monospace;font-size:1.5rem;font-weight:900;color:var(--navy2);letter-spacing:4px;">${esc(o.voucher_code)}</div>
      </div>
      <button class="copy-btn" onclick="quickCopy('${esc(o.voucher_code)}')">📋 코드 복사</button>
    </div>` : "";

  return `<div class="order-card${isPending?' is-new':''}" id="card-${o.id}">

    <!-- 헤더 -->
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;">
      <div>
        <div class="order-id">주문번호 #${o.id} · ${dt}</div>
        <div class="order-company">${esc(o.company_name)}</div>
        <div class="order-product">📦 ${PRODUCT_NAME}</div>
      </div>
      <span class="status-badge status-${o.status}">${statusLabel}</span>
    </div>

    <!-- 정보 행 (균등 간격) -->
    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;font-size:.82rem;">
      ${infoCell("구매자", esc(o.buyer_name))}
      ${infoCell("연락처", esc(o.phone))}
      ${infoCell("이메일", esc(o.email), true)}
      <div style="padding:10px 12px;border-left:1px solid var(--border);border-right:1px solid var(--border);">
        <div style="color:var(--text2);font-size:.72rem;margin-bottom:4px;">첨부파일</div>
        ${bizCell}
      </div>
      ${infoCell("결제 금액", `<span style="color:var(--red);font-weight:800;">${amtFmt}</span>`)}
      <div style="padding:10px 12px;">
        <div style="color:var(--text2);font-size:.72rem;margin-bottom:4px;">승인일시</div>
        <div style="font-weight:600;">${approvedDt || "—"}</div>
        ${msgBtn ? `<div style="margin-top:6px;">${msgBtn}</div>` : ""}
      </div>
    </div>

    ${o.memo ? `<div style="margin-top:10px;font-size:.82rem;color:var(--red);">반려 사유: ${esc(o.memo)}</div>` : ""}
    ${voucherBlock}

    <!-- 하단 버튼 -->
    ${isPending ? `
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button class="btn-approve" onclick="approveOrder(${o.id},${JSON.stringify(o)})">✅ 승인 (바우처 발급)</button>
      <button class="btn-reject"  onclick="openRejectModal(${o.id})">❌ 반려</button>
    </div>` : ""}
  </div>`;
}

function infoCell(label, val, small=false) {
  return `<div style="padding:10px 12px;border-right:1px solid var(--border);">
    <div style="color:var(--text2);font-size:.72rem;margin-bottom:4px;">${label}</div>
    <div style="font-weight:600;${small?'font-size:.78rem;word-break:break-all;':''}">${val}</div>
  </div>`;
}

// ────────────────────────────────────────────────────
// 승인
// ────────────────────────────────────────────────────
async function approveOrder(orderId, orderObj) {
  if (!confirm(`주문 #${orderId} (${orderObj.company_name})을 승인하시겠습니까?\n바우처 코드가 발급됩니다.`)) return;
  const btn = document.querySelector(`#card-${orderId} .btn-approve`);
  if (btn) { btn.disabled = true; btn.textContent = "처리 중..."; }

  try {
    const res = await fetch(`${API_URL}/admin/orders/${orderId}/approve`, {
      method:"POST", headers:{"X-Admin-Key": adminKey}
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "오류");

    await loadOrders();
    openApproveModal(data.voucher_code, orderObj);
  } catch (e) {
    showSnack("⚠️ 오류: " + e.message);
    if (btn) { btn.disabled = false; btn.textContent = "✅ 승인 (바우처 발급)"; }
  }
}

function showResendModal(orderObj) {
  openApproveModal(orderObj.voucher_code, orderObj);
}

function openApproveModal(voucherCode, o) {

  const amtFmt = o.amount ? "₩" + Number(o.amount).toLocaleString("ko-KR") + "원" : "₩495,000원";
  document.getElementById("approveCustomerInfo").innerHTML = `
    <div class="ci-row"><span class="ci-label">업체명</span><span class="ci-val">${esc(o.company_name)}</span></div>
    <div class="ci-row"><span class="ci-label">구매자</span><span class="ci-val">${esc(o.buyer_name)}</span></div>
    <div class="ci-row"><span class="ci-label">연락처</span><span class="ci-val">${esc(o.phone)}</span></div>
    <div class="ci-row"><span class="ci-label">이메일</span><span class="ci-val">${esc(o.email)}</span></div>
    <div class="ci-row"><span class="ci-label">금액</span><span class="ci-val">${amtFmt}</span></div>
    <div class="ci-row"><span class="ci-label">제품</span><span class="ci-val">${PRODUCT_NAME}</span></div>

  const kakaoMsg = `[SOEZ] ✅ 구매 승인 안내

안녕하세요, ${o.buyer_name}님!
SOEZ B2B 택배 송장 만들기 구매가 승인되었습니다.

📦 제품: ${PRODUCT_NAME}
🏢 업체명: ${o.company_name}
🔑 라이선스 코드: ${voucherCode}

💿 설치 파일 다운로드:
${DOWNLOAD_URL}

📋 활성화 방법:
① 설치 파일 다운로드 후 실행
② 라이선스 활성화 화면에서 위 코드 입력
③ [활성화] 클릭 → 완료!

※ 코드는 1대 PC에만 사용 가능합니다.
※ PC 교체 시 카카오채널로 문의해 주세요.

감사합니다! 🙏
SOEZ 고객지원`;

  // 이메일 내용 템플릿
  const emailSubject = `[SOEZ] 구매 승인 및 라이선스 코드 안내 — ${o.company_name}`;
  const emailBody = `제목: ${emailSubject}

${o.buyer_name}님, 안녕하세요.
SOEZ 고객지원팀입니다.

구매해 주신 ${PRODUCT_NAME} 승인이 완료되었습니다.

■ 라이선스 코드: ${voucherCode}
■ 제품: ${PRODUCT_NAME}
■ 업체명: ${o.company_name}

■ 설치 파일 다운로드:
${DOWNLOAD_URL}

■ 활성화 방법:
1. 위 링크에서 설치 파일 다운로드 후 실행
2. 라이선스 활성화 화면에서 코드 입력
3. [활성화] 클릭 후 완료!

※ 라이선스는 1대 PC에만 등록됩니다.
※ PC 교체 필요 시 아래로 문의해 주세요.

감사합니다.
SOEZ 고객지원
카카오채널: ${KAKAO_CH}`;

  document.getElementById("kakaoMsgBox").textContent = kakaoMsg;
  document.getElementById("emailMsgBox").textContent = emailBody;

  document.getElementById("approveModal").classList.add("open");

function closeApproveModal() {
  document.getElementById("approveModal").classList.remove("open");
}

// ────────────────────────────────────────────────────
// 복사 기능
// ────────────────────────────────────────────────────
function quickCopy(text) {
  navigator.clipboard.writeText(text).catch(() => {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); document.execCommand("copy");
    document.body.removeChild(ta);
  });
  showSnack("✅ 바우처 코드 복사 완료!");
}

function copyText(type) {
  let text = "";
  if (type === "voucherOnly") text = approveData.voucherCode || "";
  else if (type === "kakao")  text = document.getElementById("kakaoMsgBox").textContent;
  else if (type === "email")  text = document.getElementById("emailMsgBox").textContent;

  navigator.clipboard.writeText(text).then(() => {
    const labels = { voucherOnly:"코드", kakao:"카카오톡 메시지", email:"이메일 내용" };
    showSnack(`✅ ${labels[type]} 복사 완료!`);
  }).catch(() => {
    // 폴백
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); document.execCommand("copy");
    document.body.removeChild(ta);
    showSnack("✅ 복사 완료!");
  });
}

// ────────────────────────────────────────────────────
// 반려 모달
// ────────────────────────────────────────────────────
function openRejectModal(orderId) {
  pendingRejectId = orderId;
  document.getElementById("rejectOrderId").textContent = "#" + orderId;
  document.getElementById("rejectMemo").value = "";
  document.getElementById("rejectModal").classList.add("open");
}
function closeRejectModal() {
  document.getElementById("rejectModal").classList.remove("open");
  pendingRejectId = null;
}
async function confirmReject() {
  const memo = document.getElementById("rejectMemo").value.trim();
  try {
    const res = await fetch(`${API_URL}/admin/orders/${pendingRejectId}/reject`, {
      method:"POST",
      headers:{"X-Admin-Key": adminKey, "Content-Type":"application/json"},
      body: JSON.stringify({ memo })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "오류");
    showSnack(`주문 #${pendingRejectId} 반려 처리 완료`);
    closeRejectModal();
    await loadOrders();
  } catch (e) { showSnack("⚠️ 오류: " + e.message); }
}

// ────────────────────────────────────────────────────
// 새 주문 알림
// ────────────────────────────────────────────────────
function showNewOrderAlert(count) {
  const banner = document.getElementById("newOrderBanner");
  document.getElementById("newOrderCount").textContent = count;
  banner.classList.remove("hidden");
  if (Notification.permission === "granted") {
    new Notification("SOEZ 새 주문", { body: `새로운 주문 ${count}건이 접수되었습니다!`, icon: "" });
  } else if (Notification.permission !== "denied") {
    Notification.requestPermission();
  }
}
function dismissBanner() {
  document.getElementById("newOrderBanner").classList.add("hidden");
}
function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1100].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.3);
      osc.start(ctx.currentTime + i * 0.15);
      osc.stop(ctx.currentTime + i * 0.15 + 0.3);
    });
  } catch(e) {}
}

// ────────────────────────────────────────────────────
// 사업자등록증 보기
// ────────────────────────────────────────────────────
async function viewBizReg(orderId) {
  const order = allOrders.find(o => o.id === orderId);
  if (!order || !order.biz_reg_data) { showSnack("파일을 찾을 수 없습니다."); return; }
  const ext  = (order.biz_reg_name || "file").split(".").pop().toLowerCase();
  const mime = ext === "pdf" ? "application/pdf" : "image/" + ext;
  const blob = base64ToBlob(order.biz_reg_data, mime);
  window.open(URL.createObjectURL(blob), "_blank");
}
function base64ToBlob(b64, mime) {
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

// ────────────────────────────────────────────────────
// 유틸
// ────────────────────────────────────────────────────
function esc(str) {
  if (!str) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
let snackTimer;
function showSnack(msg) {
  const el = document.getElementById("snackbar");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => el.classList.remove("show"), 3500);
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeApproveModal(); closeRejectModal(); }
});
</script>
